      description: 前端拿到 putUrl 后直接 PUT 到对象存储，成功后再提交 url。驱动不支持时 code=1（回退普通上传）。
      security:
        - cookieAuth: []
      parameters:
        - name: ext
          in: query
          required: true
          schema:
            type: string
            example: png
      responses:
        "200":
          description: code=0 成功；code=1 驱动不支持 / 参数错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      putUrl:
                        type: string
                      url:
                        type: string
                      key:
                        type: string

