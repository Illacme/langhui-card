openapi: 3.0.3

# 微传名片 · 后端 API 规范
# 单一事实来源：路由见 backend/internal/handler/*.go，本文档与之保持同步。
# 本地预览：VS Code 装 "OpenAPI (Swagger) Editor" 插件，或粘贴到 https://editor.swagger.io
# 字段级映射（三端联调）另见《微传名片V1.3_三端联调与接口总表.md》。

info:
  title: 微传名片 API
  version: "1.3.0"
  description: |
    电子名片小程序 + PC 管理后台的后端接口。

    ## 通用约定
    - 响应体统一为 `{ "code": number, "msg"?: string, ... }`：
      `code=0` 成功；`code=1` 业务失败（参数错误 / 密码错误 / 资源不存在）；
      `code=2` 特殊状态（名片已停用 / 账号已停用）。
    - **鉴权失败返回的是 HTTP 200 + `{code:401}` / `{code:403}`**（历史约定，前端以 body.code 判断），
      不是 HTTP 状态码；HTTP 4xx/5xx 仅用于网关 / 框架层错误。
    - 登录限流超限返回 `{code:429}`（按客户端 IP 固定窗口）。

    ## 分页约定（管理端列表）
    - 管理端「会随时间增长」的列表（员工 / 企业 / 申请 / 平台账号 / 审计日志）一律服务端分页：
      请求 `?page=&size=`（size 缺省 20、上限 100），响应 `{ code:0, data:[...当前页...], total, page, size }`——
      **data 仍是数组**，总数与页码在顶层。越界页码由后端夹到末页并回传夹后的 page。
    - 关键字段筛选（keyword / status）同样在服务端完成：前端只筛当前页会出现
      「搜得到但翻页后又没了」的错觉。

    ## 两种鉴权方式
    - **小程序端（Bearer）**：`Authorization: Bearer <access token>`，token 由 JS 显式携带。
    - **PC 管理后台（httpOnly Cookie）**：登录后服务端下发 `access_token` / `refresh_token`
      Cookie（`HttpOnly; SameSite=Lax`），浏览器自动携带，JS 不可读。
    - access 15 分钟 / refresh 30 天；`POST /api/refresh` 静默续期；
      改密 / 禁用即时吊销（账号级 token_version），登出精确吊销当前设备（会话级 sid 黑名单）。

servers:
  - url: http://127.0.0.1:8080
    description: 本地开发（devserver / docker compose）

tags:
  - name: 系统
    description: 健康检查与指标
  - name: 公开内容
    description: 小程序首页 / 名片 / 业绩 / 服务（无需登录）
  - name: 鉴权
    description: 登录 / 刷新 / 登出
  - name: 员工端
    description: 小程序员工自服务（Bearer 鉴权）
  - name: 超管-申请审核
    description: 开通申请 / 名片修改申请审核
  - name: 超管-员工管理
    description: 员工增删改查 / 停启用 / 重置密码
  - name: 超管-内容管理
    description: 企业信息 / 分类 / 项目 / 服务 / 首页布局
  - name: 存储
    description: 上传 / 预签名 / 私有签名 / CDN 刷新 / 小程序码

paths:
  # ───────────────────────── 系统 ─────────────────────────
  /healthz:
    get:
      tags: [系统]
      summary: 健康检查（就绪探针：探活数据库）
      description: |
        先 `SELECT 1` 探活数据库：正常 `200 {status:"ok",db:"up"}`；
        DB 不可达 `503 {status:"degraded",db:"down",error:"..."}`；
        首次部署尚未配置（`DB_DSN` 未提供）时 `503 {status:"unconfigured",db:"unknown"}`。
        docker-compose 的 backend healthcheck 与最小告警 R1 依赖本端点，
        因此 DB 故障时能识别"进程在但不可用"，而非误判为健康。
        注意「未配置」也是一种不可用，必须如实 503——容器编排另按
        `/api/setup/status` 的 `configured=false` 把安装阶段视为"进程健康"。
      responses:
        "200":
          description: 服务就绪（DB 可达）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  db:
                    type: string
                    example: up
        "503":
          description: 未就绪（DB 不可达）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: degraded
                  db:
                    type: string
                    example: down
                  error:
                    type: string

  /metrics:
    get:
      tags: [系统]
      summary: Prometheus 指标（默认关闭，METRICS_ENABLED=1 开启）
      description: 文本格式指标：请求计数（按方法 × 状态类）与进程 uptime。生产建议仅内网可达。
      responses:
        "200":
          description: Prometheus text/plain
          content:
            text/plain:
              schema:
                type: string

  /api/setup/status:
    get:
      tags: [系统]
      summary: 首次安装状态（安装向导用，无需鉴权）
      description: |
        `configured` 一律以 `DB_DSN` 为准（环境变量与配置文件两层都查）。
        未配置时附带 `installable=true`、可复制的 `envText` 与 `mysqlHint`
        （编排环境预填值，**不含口令**）。前端在挂载前调用一次：
        未配置 → 渲染安装向导（旧后端没有安装接口则退回只读引导）；失败 → 按"已配置"处理。
      responses:
        "200":
          description: 安装状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      configured:
                        type: boolean
                      installable:
                        type: boolean
                      configFile:
                        type: string
                        example: ./data/runtime.env
                      adminUser:
                        type: string
                        example: admin
                      sqlitePath:
                        type: string
                        example: ./data/weichuan.db
                      envText:
                        type: string
                      missing:
                        type: array
                        items:
                          type: object
                          properties:
                            env:
                              type: string
                            why:
                              type: string
                            value:
                              type: string

  /api/setup/test:
    post:
      tags: [系统]
      summary: 测试数据库连接（不建库、不建表、不写任何东西）
      description: |
        仅在"未配置模式"下挂载（正常模式返回 404，结构上不可重放）。
        带同源检查：Origin/Referer 的宿主必须与 Host 一致，挡 CSRF 与 DNS rebinding；
        两个头都缺失（curl / 脚本）放行。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInstallReq"
      responses:
        "200":
          description: 连通（code=0，data 含掩码 DSN）或失败（code=1，msg 为可读原因）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      driver:
                        type: string
                        example: mysql
                      dsn:
                        type: string
                        description: 掩码后的连接串（口令显示为 ******）
                      willCreate:
                        type: boolean
                      note:
                        type: string

  /api/setup/install:
    post:
      tags: [系统]
      summary: 执行安装（建库建表 + seed 超管 + 写配置文件 + 自重启）
      description: |
        同样的未配置模式门禁与同源检查，另外还有两道硬条件：
        (1) 进程内一次性锁，装过一次即拒绝；(2) 目标库 `admins` 表已有数据即拒绝，
        绝不接管在用系统。配置写入 `CONFIG_FILE`（0600、临时文件 + rename 原子写），
        最后由页面轮询 `/api/setup/status` 感知 `configured=true` 后跳登录页。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInstallReq"
      responses:
        "200":
          description: 安装成功（code=0）或失败（code=1）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                      driver:
                        type: string
                      dsn:
                        type: string
                      configFile:
                        type: string
                      restarted:
                        type: boolean
                        description: 是否已安排自重启（Linux 用 syscall.Exec；Windows 为 false，需人工重启）
                      message:
                        type: string

  # ───────────────────────── 公开内容 ─────────────────────────
  /api/card:
    get:
      tags: [公开内容]
      summary: 聚合名片（员工 + 企业信息 + 公司简介）
      parameters:
        - name: staffId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: |
            code=0 成功；code=1 员工不存在；code=2 名片已停用（无数据）。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  msg:
                    type: string
                  employee:
                    $ref: "#/components/schemas/Employee"
                  company:
                    $ref: "#/components/schemas/CompanyInfo"
                  profile:
                    $ref: "#/components/schemas/CompanyProfile"

  /api/achievements:
    get:
      tags: [公开内容]
      summary: 经典业绩（分类 + 首页精选项目）
      description: >-
        featured 为首页精选，最多 20 条（首页只画得下这些）；只返回 id / categoryId /
        name / summary / cover，不含 detail 富文本。分类列表不受此上限约束。
        响应带 Cache-Control: public, max-age=60。
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/AchievementCategory"
                  featured:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectCase"

  /api/projects:
    get:
      tags: [公开内容]
      summary: 项目案例列表（按分类；列表字段，不含富文本正文）
      description: >-
        一次全量展示（端上无分页 UI）。条数上限 200，可用 limit 调小；超上限一律夹到 200。
        列表只返回 id / categoryId / name / summary / cover / categoryName——detail 富文本
        与 album 图集不随列表下发，详情请取 /api/projects/{id}。响应带 Cache-Control:
        public, max-age=60（给 CDN / 反代用）。
      parameters:
        - name: categoryId
          in: query
          required: false
          description: 分类 ID；不传表示全部上架案例
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          description: 返回条数上限，默认 200、最大 200；非法值或 0 回落默认
          schema:
            type: integer
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectCase"

  /api/projects/{id}:
    get:
      tags: [公开内容]
      summary: 项目案例详情（album 解析为数组）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0 成功；code=1 不存在或已下架
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/ProjectDetail"

  /api/services:
    get:
      tags: [公开内容]
      summary: 业务服务列表（列表字段，不含富文本正文）
      description: >-
        条数上限 50，可用 limit 调小。列表只返回 id / title / icon / sort——content 富文本
        不随列表下发，详情请取 /api/services/{id}。响应带 Cache-Control: public, max-age=60。
      parameters:
        - name: limit
          in: query
          required: false
          description: 返回条数上限，默认 50、最大 50
          schema:
            type: integer
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BizService"

  /api/services/{id}:
    get:
      tags: [公开内容]
      summary: 业务服务详情（content 为富文本，含视频号块）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0 成功；code=1 不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/BizService"

  /api/home-layout:
    get:
      tags: [公开内容]
      summary: 首页板块顺序
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  order:
                    type: array
                    items:
                      type: string
                    example: [achievement, service]

  /api/stat/track:
    post:
      tags: [公开内容]
      summary: 埋点上报（点击类事件）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffId, eventType]
              properties:
                staffId:
                  type: integer
                  format: int64
                eventType:
                  type: string
                  example: visit
      responses:
        "200":
          description: code=0 成功；code=1 参数错误 / 上报失败

  # ───────────────────────── 鉴权 ─────────────────────────
  /api/employee/login:
    post:
      tags: [鉴权]
      summary: 员工登录（手机号 + 密码，小程序端）
      description: |
        限流：每 IP 每分钟 10 次。成功返回双令牌（响应体），此后走 Bearer 鉴权。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=1 账号不存在 / 密码错误；code=2 账号已停用
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  token:
                    type: string
                    description: access 令牌
                  refreshToken:
                    type: string
                  expiresIn:
                    type: integer
                    example: 900

  /api/admin/login:
    post:
      tags: [鉴权]
      summary: 超管登录（用户名 + 密码，PC 后台）
      description: |
        限流：每 IP 每分钟 10 次。成功**不下发令牌到响应体**，改为 Set-Cookie
        （access_token / refresh_token，HttpOnly; SameSite=Lax）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=1 账号不存在 / 密码错误
          headers:
            Set-Cookie:
              description: access_token / refresh_token（HttpOnly）
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  expiresIn:
                    type: integer
                    example: 900

  /api/refresh:
    post:
      tags: [鉴权]
      summary: 刷新 access 令牌
      description: |
        Cookie 流（PC）：带 refresh_token Cookie，Body 可空，轮换下发新 Cookie。
        Body 流（小程序）：传 `{ "refreshToken": "..." }`，返回新 access。
        限流：每 IP 每分钟 60 次。会话已登出（sid 黑名单）时返回 401。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=401 刷新令牌无效 / 类型错误 / 已失效
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  token:
                    type: string
                    description: 新 access（Body 流才有）
                  expiresIn:
                    type: integer

  /api/logout:
    post:
      tags: [鉴权]
      summary: 登出（吊销当前会话 + 清除 Cookie）
      description: |
        单设备精确吊销：从 Bearer / Cookie 解析当前会话 sid 写入黑名单，
        该设备所有令牌立即失效；不影响同一账号其他设备。
        access 过期时退而解析 refresh_token Cookie，仍可收尾会话。
        不挂鉴权中间件（过期后也需能登出）。
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: code=0（无有效令牌时同样成功，仅清 Cookie）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  msg:
                    type: string

  # ───────────────────────── 员工端 ─────────────────────────
  /api/employee/me:
    get:
      tags: [员工端]
      summary: 本人名片
      security:
        - bearerAuth: []
      responses:
        "200":
          description: code=0 成功；code=401 未登录 / 令牌失效
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/Employee"
                  pendingModify:
                    type: boolean
                    description: 是否有待审的名片修改申请（编辑名片页据此展示"审核中"标签）
    put:
      tags: [员工端]
      summary: 提交名片信息修改申请（审核通过后才生效）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                properties:
                  avatar:
                    type: string
                  name:
                    type: string
                  title:
                    type: string
                  phone:
                    type: string
                  phone2:
                    type: string
                    description: 第二个手机号（选填）；名片上与主号并列展示，不参与登录
                  landline:
                    type: string
                  email:
                    type: string
      responses:
        "200":
          description: code=0 已提交；code=1 参数错误 / 无变更

  /api/employee/me/stat:
    get:
      tags: [员工端]
      summary: 本人名片访问统计
      security:
        - bearerAuth: []
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      visit:
                        type: integer
                        description: 浏览次数
                      call:
                        type: integer
                        description: 拨打次数
                      save:
                        type: integer
                        description: 保存次数

  /api/employee/password:
    put:
      tags: [员工端]
      summary: 修改本人密码（成功后旧令牌全部失效）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old, new]
              properties:
                old:
                  type: string
                new:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=1 原密码错误 / 参数错误

  # ───────────────────────── 超管-申请审核 ─────────────────────────
  /api/apply/open:
    post:
      tags: [超管-申请审核]
      summary: 提交开通申请（公开，员工自助）
      description: 员工扫码/分享落地后自助提交开通申请，status 置 pending，等待超管审核。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenApply"
      responses:
        "200":
          description: code=0 已提交；code=1 参数错误 / 提交失败

  /api/admin/apply/open:
    get:
      tags: [超管-申请审核]
      summary: 开通申请列表（服务端分页）
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: keyword
          in: query
          required: false
          description: 模糊匹配姓名 / 手机 / 手机2 / 邮箱 / 昵称
          schema:
