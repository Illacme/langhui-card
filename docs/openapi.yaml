openapi: 3.0.3

# 朗汇机电电子名片小程序 · 后端 API 规范
# 单一事实来源：路由见 backend/internal/handler/*.go，本文档与之保持同步。
# 本地预览：VS Code 装 "OpenAPI (Swagger) Editor" 插件，或粘贴到 https://editor.swagger.io
# 字段级映射（三端联调）另见《朗汇机电小程序V1.3_三端联调与接口总表.md》。

info:
  title: 朗汇机电名片小程序 API
  version: "1.3.0"
  description: |
    电子名片小程序 + PC 管理后台的后端接口。

    ## 通用约定
    - 响应体统一为 `{ "code": number, "msg"?: string, ... }`：
      `code=0` 成功；`code=1` 业务失败（参数错误 / 密码错误 / 资源不存在）；
      `code=2` 特殊状态（名片已停用 / 账号已停用）。
    - **鉴权失败返回的是 HTTP 200 + `{code:401}` / `{code:403}`**（历史约定，前端以 body.code 判断），
      不是 HTTP 状态码；HTTP 4xx/5xx 仅用于网关 / 框架层错误。
    - 登录限流超限返回 `{code:429}`（按客户端 IP 固定窗口）。

    ## 两种鉴权方式
    - **小程序端（Bearer）**：`Authorization: Bearer <access token>`，token 由 JS 显式携带。
    - **PC 管理后台（httpOnly Cookie）**：登录后服务端下发 `access_token` / `refresh_token`
      Cookie（`HttpOnly; SameSite=Lax`），浏览器自动携带，JS 不可读。
    - access 15 分钟 / refresh 30 天；`POST /api/refresh` 静默续期；
      改密 / 禁用即时吊销（账号级 token_version），登出精确吊销当前设备（会话级 sid 黑名单）。

servers:
  - url: http://127.0.0.1:8080
    description: 本地开发（devserver / docker compose）

tags:
  - name: 系统
    description: 健康检查与指标
  - name: 公开内容
    description: 小程序首页 / 名片 / 业绩 / 服务（无需登录）
  - name: 鉴权
    description: 登录 / 刷新 / 登出
  - name: 员工端
    description: 小程序员工自服务（Bearer 鉴权）
  - name: 超管-申请审核
    description: 开通申请 / 名片修改申请审核
  - name: 超管-员工管理
    description: 员工增删改查 / 停启用 / 重置密码
  - name: 超管-内容管理
    description: 企业信息 / 分类 / 项目 / 服务 / 首页布局
  - name: 存储
    description: 上传 / 预签名 / 私有签名 / CDN 刷新 / 小程序码

paths:
  # ───────────────────────── 系统 ─────────────────────────
  /healthz:
    get:
      tags: [系统]
      summary: 健康检查（就绪探针：探活数据库）
      description: |
        先 `SELECT 1` 探活数据库：正常 `200 {status:"ok",db:"up"}`；
        DB 不可达 `503 {status:"degraded",db:"down",error:"..."}`。
        docker-compose 的 backend healthcheck 与最小告警 R1 依赖本端点，
        因此 DB 故障时能识别"进程在但不可用"，而非误判为健康。
      responses:
        "200":
          description: 服务就绪（DB 可达）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  db:
                    type: string
                    example: up
        "503":
          description: 未就绪（DB 不可达）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: degraded
                  db:
                    type: string
                    example: down
                  error:
                    type: string

  /metrics:
    get:
      tags: [系统]
      summary: Prometheus 指标（默认关闭，METRICS_ENABLED=1 开启）
      description: 文本格式指标：请求计数（按方法 × 状态类）与进程 uptime。生产建议仅内网可达。
      responses:
        "200":
          description: Prometheus text/plain
          content:
            text/plain:
              schema:
                type: string

  # ───────────────────────── 公开内容 ─────────────────────────
  /api/card:
    get:
      tags: [公开内容]
      summary: 聚合名片（员工 + 企业信息 + 公司简介）
      parameters:
        - name: staffId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: |
            code=0 成功；code=1 员工不存在；code=2 名片已停用（无数据）。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  msg:
                    type: string
                  employee:
                    $ref: "#/components/schemas/Employee"
                  company:
                    $ref: "#/components/schemas/CompanyInfo"
                  profile:
                    $ref: "#/components/schemas/CompanyProfile"

  /api/achievements:
    get:
      tags: [公开内容]
      summary: 经典业绩（分类 + 首页精选项目）
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/AchievementCategory"
                  featured:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectCase"

  /api/projects:
    get:
      tags: [公开内容]
      summary: 项目案例列表（按分类）
      parameters:
        - name: categoryId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectCase"

  /api/projects/{id}:
    get:
      tags: [公开内容]
      summary: 项目案例详情（album 解析为数组）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0 成功；code=1 不存在或已下架
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/ProjectDetail"

  /api/services:
    get:
      tags: [公开内容]
      summary: 业务服务列表
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BizService"

  /api/services/{id}:
    get:
      tags: [公开内容]
      summary: 业务服务详情（content 为富文本，含视频号块）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0 成功；code=1 不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/BizService"

  /api/home-layout:
    get:
      tags: [公开内容]
      summary: 首页板块顺序
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  order:
                    type: array
                    items:
                      type: string
                    example: [achievement, service]

  /api/stat/track:
    post:
      tags: [公开内容]
      summary: 埋点上报（点击类事件）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffId, eventType]
              properties:
                staffId:
                  type: integer
                  format: int64
                eventType:
                  type: string
                  example: visit
      responses:
        "200":
          description: code=0 成功；code=1 参数错误 / 上报失败

  # ───────────────────────── 鉴权 ─────────────────────────
  /api/employee/login:
    post:
      tags: [鉴权]
      summary: 员工登录（手机号 + 密码，小程序端）
      description: |
        限流：每 IP 每分钟 10 次。成功返回双令牌（响应体），此后走 Bearer 鉴权。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=1 账号不存在 / 密码错误；code=2 账号已停用
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  token:
                    type: string
                    description: access 令牌
                  refreshToken:
                    type: string
                  expiresIn:
                    type: integer
                    example: 900

  /api/admin/login:
    post:
      tags: [鉴权]
      summary: 超管登录（用户名 + 密码，PC 后台）
      description: |
        限流：每 IP 每分钟 10 次。成功**不下发令牌到响应体**，改为 Set-Cookie
        （access_token / refresh_token，HttpOnly; SameSite=Lax）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=1 账号不存在 / 密码错误
          headers:
            Set-Cookie:
              description: access_token / refresh_token（HttpOnly）
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  expiresIn:
                    type: integer
                    example: 900

  /api/refresh:
    post:
      tags: [鉴权]
      summary: 刷新 access 令牌
      description: |
        Cookie 流（PC）：带 refresh_token Cookie，Body 可空，轮换下发新 Cookie。
        Body 流（小程序）：传 `{ "refreshToken": "..." }`，返回新 access。
        限流：每 IP 每分钟 60 次。会话已登出（sid 黑名单）时返回 401。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=401 刷新令牌无效 / 类型错误 / 已失效
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  token:
                    type: string
                    description: 新 access（Body 流才有）
                  expiresIn:
                    type: integer

  /api/logout:
    post:
      tags: [鉴权]
      summary: 登出（吊销当前会话 + 清除 Cookie）
      description: |
        单设备精确吊销：从 Bearer / Cookie 解析当前会话 sid 写入黑名单，
        该设备所有令牌立即失效；不影响同一账号其他设备。
        access 过期时退而解析 refresh_token Cookie，仍可收尾会话。
        不挂鉴权中间件（过期后也需能登出）。
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: code=0（无有效令牌时同样成功，仅清 Cookie）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  msg:
                    type: string

  # ───────────────────────── 员工端 ─────────────────────────
  /api/employee/me:
    get:
      tags: [员工端]
      summary: 本人名片
      security:
        - bearerAuth: []
      responses:
        "200":
          description: code=0 成功；code=401 未登录 / 令牌失效
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/Employee"
                  pendingModify:
                    type: boolean
                    description: 是否有待审的名片修改申请（编辑名片页据此展示"审核中"标签）
    put:
      tags: [员工端]
      summary: 提交名片信息修改申请（审核通过后才生效）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                properties:
                  avatar:
                    type: string
                  name:
                    type: string
                  title:
                    type: string
                  phone:
                    type: string
                  landline:
                    type: string
                  email:
                    type: string
      responses:
        "200":
          description: code=0 已提交；code=1 参数错误 / 无变更

  /api/employee/me/stat:
    get:
      tags: [员工端]
      summary: 本人名片访问统计
      security:
        - bearerAuth: []
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      visit:
                        type: integer
                        description: 浏览次数
                      call:
                        type: integer
                        description: 拨打次数
                      save:
                        type: integer
                        description: 保存次数

  /api/employee/password:
    put:
      tags: [员工端]
      summary: 修改本人密码（成功后旧令牌全部失效）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old, new]
              properties:
                old:
                  type: string
                new:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=1 原密码错误 / 参数错误

  # ───────────────────────── 超管-申请审核 ─────────────────────────
  /api/apply/open:
    post:
      tags: [超管-申请审核]
      summary: 提交开通申请（公开，员工自助）
      description: 员工扫码/分享落地后自助提交开通申请，status 置 pending，等待超管审核。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenApply"
      responses:
        "200":
          description: code=0 已提交；code=1 参数错误 / 提交失败

  /api/admin/apply/open:
    get:
      tags: [超管-申请审核]
      summary: 开通申请列表
      security:
        - cookieAuth: []
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OpenApply"

  /api/admin/apply/open/{id}/approve:
    post:
      tags: [超管-申请审核]
      summary: 通过开通申请（自动建员工，返回初始密码）
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0 成功；code=1 已处理 / 不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  staffId:
                    type: integer
                    format: int64
                  initialPassword:
                    type: string

  /api/admin/apply/open/{id}/reject:
    post:
      tags: [超管-申请审核]
      summary: 驳回开通申请
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=1 已处理 / 不存在

  /api/admin/apply/modify:
    get:
      tags: [超管-申请审核]
      summary: 名片修改申请列表
      security:
        - cookieAuth: []
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CardModifyApply"

  /api/admin/apply/modify/{id}/approve:
    post:
      tags: [超管-申请审核]
      summary: 通过名片修改申请（字段覆盖到员工）
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0 成功；code=1 已处理 / 不存在

  /api/admin/apply/modify/{id}/reject:
    post:
      tags: [超管-申请审核]
      summary: 驳回名片修改申请
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=1 已处理 / 不存在

  # ───────────────────────── 超管-员工管理 ─────────────────────────
  /api/admin/employees:
    get:
      tags: [超管-员工管理]
      summary: 员工列表
      security:
        - cookieAuth: []
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Employee"
    post:
      tags: [超管-员工管理]
      summary: 新增员工（返回初始密码，仅展示一次）
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name:
                  type: string
                phone:
                  type: string
                title:
                  type: string
                email:
                  type: string
                avatar:
                  type: string
                landline:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=1 手机号已存在 / 参数错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  staffId:
                    type: integer
                    format: int64
                  initialPassword:
                    type: string

  /api/admin/employees/{id}:
    put:
      tags: [超管-员工管理]
      summary: 编辑员工资料（即时生效，不经过员工端审核流）
      description: |
        只开放白名单字段：姓名 / 职位 / 手机 / 座机 / 邮箱 / 头像。
        状态、密码各有专门端点（disable/enable/reset-password），此处不混写，避免绕过安全戳逻辑。
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                title:
                  type: string
                phone:
                  type: string
                landline:
                  type: string
                email:
                  type: string
                avatar:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=1 参数错误（姓名与手机必填）/ 不存在

  /api/admin/employees/{id}/disable:
    post:
      tags: [超管-员工管理]
      summary: 停用员工（其令牌全部失效，名片页提示已停用）
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0 成功；code=1 不存在

  /api/admin/employees/{id}/enable:
    post:
      tags: [超管-员工管理]
      summary: 启用员工
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0 成功；code=1 不存在

  /api/admin/employees/{id}/reset-password:
    post:
      tags: [超管-员工管理]
      summary: 重置员工密码（返回新初始密码；旧令牌失效）
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0 成功；code=1 不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
