      description: >-
        供后台「公司简介 → 视频来源」判断「云存储上传」档能否选择。
        videoUpload 为 true 的条件是：驱动为对象存储（非本地磁盘）且实现了直传预签名。
        本地磁盘驱动下上传视频会占用应用服务器磁盘与出网带宽，故必须禁用该档。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      driver:
                        type: string
                        example: oss
                      presign:
                        type: boolean
                      videoUpload:
                        type: boolean
                        description: 视频上传档是否可用（driver 非 local 且 presign）
                      videoMaxMb:
                        type: integer
                        description: 视频上传上限，来自系统设置 upload_video_max_mb
                      reason:
                        type: string
                        description: 不可用时给用户的中文原因，可用时为空串

  /api/employee/upload/presign:
    get:
      tags: [存储]
      summary: 直传预签名 PUT URL（员工端）
      security:
        - bearerAuth: []
      parameters:
        - name: ext
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 同 /api/admin/upload/presign

  /api/admin/storage/sign:
    post:
      tags: [存储]
      summary: 私有桶限时签名（按 URL 反推 key）
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: code=0 成功；code=1 驱动不支持 / CDN 未配置或厂商凭据不全
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      signed:
                        type: object
                        additionalProperties:
                          type: string

  /api/employee/storage/sign:
    post:
      tags: [存储]
      summary: 私有桶限时签名（员工端）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: 同 /api/admin/storage/sign

  /api/admin/cdn/refresh:
    post:
      tags: [存储]
      summary: 触发 CDN 缓存刷新
      description: >-
        按当前配置的 CDN 厂商提交刷新：阿里云 / 腾讯云 / 七牛云 / Cloudflare / AWS CloudFront。
        服务端按厂商的单次上限自动分批（七牛 20 条、Cloudflare 30 条、其余 1000 条）。
        CloudFront 只提交 URL 的 path 部分（不含协议、主机与查询串）。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  items:
                    type: string
                  maxItems: 1000
      responses:
        "200":
          description: code=0 成功；code=1 未配置 CDN 凭据

  /api/storage/file:
    get:
      tags: [存储]
      summary: 本地私有文件流（private + local 驱动时可用）
      security:
        - cookieAuth: []
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 文件内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/employee/storage/file:
    get:
      tags: [存储]
      summary: 本地私有文件流（员工端）
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 文件内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/wechat/wxacode:
    get:
      tags: [存储]
      summary: 生成员工小程序码（wxacodeunlimit，scene=staffId=N）
      description: 磁盘 / 对象存储缓存；未配置 WX_APPID/WX_APPSECRET 时 code=1。
      parameters:
        - name: staffId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: string
            example: pages/index/index
      responses:
        "200":
          description: code=0 成功（data.url 为小程序码图片地址）；code=1 未配置微信凭据
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      url:
                        type: string

  # ===== 系统设置（运行参数后台化）=====
  # 配置项分三档：即时生效 / 需重启 / 只读（详见 backend/internal/setting 包注释）。
  # 敏感项（密钥 / 连接串）只回传掩码 "******"，真实值永不出现在响应里。
  /api/public/settings:
    get:
      summary: 公开配置（无需登录）
      description: |
        仅下发非敏感的三项：brand_name / miniprogram_base_url / pinned_company_id。
        小程序冷启动与 PC 登录页取品牌名都走这个接口，因此**不能要求登录**。
      tags: [设置]
      responses:
        "200":
          description: code=0，data 为 key→value 映射
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    additionalProperties:
                      type: string

  /api/admin/settings:
    get:
      summary: 读取全部可配置项（平台超管）
      description: |
        返回 registry 全量项（当前 35 项），每项带生效方式元数据：
        - name：中文名（界面主标签，key 降级为次要灰字）
        - secret：敏感项，value 恒为掩码 "******"（真实值不下发）
        - restart：保存后需重启进程才生效（云存储 / CDN 客户端在启动时构造）
        - readOnly：只读项（db_dsn / jwt_key / cookie_*），PUT 会被拒绝
        - envVar：对应环境变量名（留空时回退它）
        - options：枚举候选值（仅枚举项有，如 storage_driver），界面据此渲染下拉
        - configured：当前是否已有有效值
      tags: [设置]
      responses:
        "200":
          description: code=0，data 为设置项数组
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SettingItem"
    put:
      summary: 批量更新配置（平台超管）
      description: |
        只提交变更项（map[key]value，值统一为字符串）。语义：
        - 非敏感项：提交空串 = 清空并回退同名环境变量
        - 敏感项：留空 = 不修改；提交掩码 "******" 会被拒绝（避免把掩码写成真值）
        - readOnly 项一律拒绝，msg 里提示改用环境变量
        - **值域校验**（类型合法 ≠ 取值合法），非法值直接 code=1 并在 msg 说明原因：
          upload_max_mb 取 1~1024；miniprogram_base_url / upload_base_url 必须 http(s):// 开头；
          storage_driver 只能 local / minio / oss / s3；pinned_company_id 须为 0 或存在且启用的企业 ID
        回包 data.restartKeys 点名「需重启才生效」的项，前端据此提示。
      tags: [设置]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
              example: { "brand_name": "朗汇机电", "upload_max_mb": "20" }
      responses:
        "200":
          description: code=0 保存成功；code=1 校验失败（类型非法 / 值域越界 / 未知 key / 只读项 / 掩码值）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      restartKeys:
                        type: array
                        items:
                          type: string

  # ===== 平台超管账号管理 =====
  /api/admin/platform-admins:
    get:
      summary: 平台超管列表（company_id=0，服务端分页）
      tags: [账号]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: code=0
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformAdmin"
                  total:
                    $ref: "#/components/schemas/PageTotal"
                  page:
                    $ref: "#/components/schemas/PageIndex"
                  size:
                    $ref: "#/components/schemas/PageSize"
    post:
      summary: 新增平台超管
      description: 用户名全表唯一（含企业管理员）。护栏不能绕过：至少一个平台超管。
      tags: [账号]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: code=0（data.id / data.username）；code=1 用户名已存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                      username:
                        type: string

  /api/admin/platform-admins/{id}:
    put:
      summary: 改用户名（可改自己或同级账号）
      description: |
        限定 company_id=0，改不到企业管理员头上。令牌里不含用户名，改名不踢会话；
        self=true 表示改的是当前登录账号（前端据此刷新顶栏）。
      tags: [账号]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
      responses:
        "200":
          description: code=0（data.self）；code=1 用户名已存在 / 账号不存在
    delete:
      summary: 删除平台超管
      description: 护栏：不能删当前登录账号；至少保留一个平台超管。
      tags: [账号]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0；code=1 违反护栏

  /api/admin/platform-admins/{id}/password:
    post:
      summary: 重置密码（不需原密码，用于给别人重置）
      description: |
        安全戳自增 → 该账号所有会话立即失效。改**自己**的密码走 PUT /api/admin/password（需校验原密码）。
      tags: [账号]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        "200":
          description: code=0（data.self=true 时前端应登出重登）

  # ===== 操作审计日志（只读）=====
  /api/admin/audit-logs:
    get:
      summary: 查询操作审计日志（平台超管）
      description: |
        记录后台写操作与登录失败：谁在什么时候、对什么对象做了什么、成功没有。
        **只提供查询**：审计记录一旦可改就等于没有审计。
        敏感值（密钥 / 密码 / 连接串）在 detail 里只记「已修改」，绝不落明文。
      tags: [审计]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: action
          in: query
          required: false
          description: 如 setting.update / admin.reset_password / login.fail
          schema:
            type: string
        - name: actorType
          in: query
          required: false
          schema:
            type: string
            enum: [admin, employee, anonymous]
        - name: actorId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: result
          in: query
          required: false
          schema:
            type: string
            enum: [success, fail]
      responses:
        "200":
          description: code=0；code=403 非平台超管
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  total:
                    $ref: "#/components/schemas/PageTotal"
                  page:
                    $ref: "#/components/schemas/PageIndex"
                  size:
                    $ref: "#/components/schemas/PageSize"

  # ===== 租户（企业）管理：仅平台超管 =====
  /api/admin/companies:
    get:
      summary: 企业列表（含员工数 / 管理员数）
      description: |
        服务端分页：page/size 见「分页约定」。员工数与管理员数按当前页的企业批量统计，
        不是逐企业 COUNT。
      tags: [租户]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: keyword
          in: query
          required: false
          description: 模糊匹配企业名称 / 简称
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [enabled, disabled]
      responses:
        "200":
          description: code=0；code=403 非平台超管
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyItem"
                  total:
                    $ref: "#/components/schemas/PageTotal"
                  page:
                    $ref: "#/components/schemas/PageIndex"
                  size:
                    $ref: "#/components/schemas/PageSize"
    post:
      summary: 开通企业（可选一并创建企业管理员）
      description: |
        简称（shortName）：PC 后台侧边栏品牌名缺省「微传名片」；显式填写的值同时作为
        公司信息简称的初始值，此后两者相互独立。
        independent_lock 开启时整体只读，写操作一律 code=403。
      tags: [租户]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                shortName:
                  type: string
                adminUsername:
                  type: string
                  description: 与 adminPassword 必须同时填写或同时留空
                adminPassword:
                  type: string
      responses:
        "200":
          description: code=0（data.id / data.name / data.shortName）；code=1 参数错误 / 用户名已存在

  /api/admin/companies/{id}:
    put:
      summary: 编辑企业（名称 / 简称）
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                shortName:
                  type: string
      responses:
        "200":
          description: code=0；code=1 未找到

  /api/admin/companies/{id}/status:
    post:
      summary: 停用 / 启用企业（停用后该企业管理员与员工均不能登录）
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [enabled, disabled]
      responses:
        "200":
          description: code=0；code=1 未找到

  /api/admin/companies/{id}/admins:
    get:
      summary: 企业管理员列表
      description: 单个企业下的管理员数量天然有界（几个），不分页，返回数组。
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformAdmin"
    post:
      summary: 新增企业管理员（用户名全表唯一）
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: code=0（data.id / data.username）；code=1 企业不存在 / 用户名已存在

components:
  # 分页约定（管理端列表统一）：请求 ?page=&size=，响应 data 为**当前页数组**，
  # total/page/size 放在顶层。实现见 backend/internal/handler/pagination.go。
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        maximum: 100

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "小程序端 access 令牌（Authorization: Bearer <token>）"
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: PC 管理后台 httpOnly Cookie（浏览器自动携带）

  schemas:
    Code:
      type: integer
      description: 0=成功；1=业务失败；2=特殊状态；401=未登录/失效；403=无权限；429=限流
      enum: [0, 1, 2, 401, 403, 429]

    # ── 分页元信息（与 data 同级，见 components/parameters 的分页约定）──
    PageTotal:
      type: integer
      description: 符合条件的总条数（不是当前页条数）
    PageIndex:
      type: integer
      description: 实际生效的页码（越界时后端会夹到末页并回传夹后的值）
    PageSize:
      type: integer
      description: 实际生效的每页条数（缺省 20，上限 100）

    CompanyItem:
      type: object
      description: 企业列表项（含员工 / 管理员数量）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        shortName:
          type: string
        status:
          type: string
          enum: [enabled, disabled]
        employeeCount:
          type: integer
        adminCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    Employee:
      type: object
      properties:
        staffId:
          type: integer
          format: int64
        name:
          type: string
        title:
          type: string
        avatar:
          type: string
        phone:
          type: string
        phone2:
          type: string
          description: 第二个手机号（选填）；名片上与主号并列展示，不参与登录
        landline:
          type: string
          description: 座机
        email:
          type: string
        status:
          type: string
          enum: [enabled, disabled]
        createdAt:
          type: string
          format: date-time

    CompanyInfo:
      type: object
      properties:
        fullName:
          type: string
        address:
          type: string
        tel:
          type: string
        logo:
          type: string

    CompanyInfoInput:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
        address:
          type: string
        tel:
          type: string
        logo:
          type: string

    CompanyProfile:
      type: object
      properties:
        introText:
          type: string
          description: 富文本
        videoSource:
          type: string
          enum: [none, channels, upload, url, tencent]
          description: >-
            视频来源，决定小程序端渲染哪一档：none 不展示视频（显示封面占位）；
            channels 微信视频号（存储与流量由微信承担，官方声明该组件无视听资质要求）；
            upload 云存储上传（对象存储直传，不经应用服务器）；
            url 外部 MP4 直链（流量与资质由客户承担）；
            tencent 腾讯视频插件（预留，服务端暂拒：插件须在 app.json 静态声明）
        videoChannelId:
          type: string
          description: 视频号 ID，sph 开头（留档用；定位具体视频靠 videoFeedId）
        videoFeedId:
          type: string
          description: 视频号视频 feedId，**仅同主体生效**（可自动播放，优先）
        videoFeedToken:
          type: string
          description: >-
            跨主体凭证。官方明确 feed-id「仅同主体时生效」，视频号与小程序不同主体时必须改用它
            （基础库 2.31.1+，非个人主体小程序），代价是强制 autoplay=false。
            与 videoFeedId 二选一，videoFeedId 非空时本字段不生效
        videoVid:
          type: string
          description: 腾讯视频 vid（预留字段，当前不可选）
        videoUrl:
          type: string
          description: MP4 地址，由 upload 与 url 两档共用，也是开启兜底时的回落源
        videoFallbackUrl:
          type: boolean
          description: 主源（视频号/腾讯视频）播放失败时是否改用 videoUrl
        cover:
          type: string

    CompanyProfileInput:
      type: object
      properties:
        introText:
          type: string
        videoSource:
          type: string
          enum: [none, channels, upload, url, tencent]
        videoChannelId:
          type: string
        videoFeedId:
          type: string
        videoFeedToken:
          type: string
        videoVid:
          type: string
        videoUrl:
          type: string
        videoFallbackUrl:
          type: boolean
        cover:
          type: string

    AchievementCategory:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        icon:
          type: string
        sort:
          type: integer
        isLocked:
          type: boolean

    ProjectCase:
      type: object
      properties:
        id:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        name:
          type: string
        summary:
          type: string
        detail:
          type: string
        cover:
          type: string
        album:
          description: JSON 数组字符串（列表接口）；详情接口解析为字符串数组
          type: string
        isHomeFeatured:
          type: boolean
        enabled:
          type: boolean
        sort:
          type: integer
        createdAt:
          type: string
          format: date-time

    ProjectInput:
      type: object
      required: [categoryId, name]
      properties:
        categoryId:
          type: integer
          format: int64
        name:
          type: string
        summary:
          type: string
        detail:
          type: string
        cover:
          type: string
        album:
          type: array
          items:
            type: string
        isHomeFeatured:
          type: boolean
        enabled:
          type: boolean
        sort:
          type: integer

    ProjectDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        summary:
          type: string
        detail:
          type: string
        cover:
          type: string
        album:
          type: array
          items:
            type: string
        categoryId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    BizService:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
          description: >-
            富文本，视频号块为 <wx-video feed-id="…" feed-token="…" channel-id="sph_…"></wx-video>。
            优先级 feed-id（同主体，可自动播放）> feed-token（跨主体，强制不能自动播放）>
            channel-id（视频号 ID，sph 开头，仅在两者都缺失时回退展示视频号主页，兼容存量内容）
        sort:
          type: integer
        createdAt:
          type: string
          format: date-time

    OpenApply:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        phone:
          type: string
        phone2:
          type: string
          description: 第二个手机号（选填）；名片上与主号并列展示，不参与登录
        email:
          type: string
        title:
          type: string
        avatar:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectReason:
          type: string
        createdAt:
          type: string
          format: date-time

    CardModifyApply:
      type: object
      properties:
        id:
          type: integer
          format: int64
        staffId:
          type: integer
          format: int64
        snapshot:
          type: string
          description: JSON：变更字段 {avatar,name,title,phone,email}
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectReason:
          type: string
        createdAt:
          type: string
          format: date-time

    SettingItem:
      type: object
      description: |
        系统设置项（GET /api/admin/settings）。三档生效方式见 secret / restart / readOnly。
      properties:
        key:
          type: string
          description: 配置项标识（环境变量风格，界面降级为次要灰字展示）
        name:
          type: string
          description: 中文名（界面主标签）；为空时前端回落显示 key
        group:
          type: string
          enum: [general, miniprogram, upload, wechat, auth, storage, security, feature]
        type:
          type: string
          enum: [int, string, bool, string_slice]
        description:
          type: string
        value:
          type: string
          description: 当前值；敏感项（secret=true）恒为掩码 "******"
        secret:
          type: boolean
        restart:
          type: boolean
          description: 保存后需重启进程才生效
        readOnly:
          type: boolean
          description: 只读项，PUT 会被拒绝（只能改环境变量）
        envVar:
          type: string
          description: 对应环境变量名；留空时回退它
        options:
          type: array
          items:
            type: string
          description: 枚举候选值（仅枚举项有，如 storage_driver 的 local/minio/oss/s3）；界面据此渲染下拉，缺失时按文本框渲染
        configured:
          type: boolean

    PlatformAdmin:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        createdAt:
          type: string
          format: date-time

    AuditLog:
      type: object
      description: |
        操作审计记录。只追加不修改；敏感值在 detail 里只记「已修改」。
      properties:
        id:
          type: integer
          format: int64
        actorType:
          type: string
          enum: [admin, employee, anonymous]
        actorId:
          type: integer
          format: int64
        actorName:
          type: string
          description: 冗余用户名：账号被删除后仍可追溯是谁操作的
        companyId:
          type: integer
          format: int64
        action:
          type: string
          example: setting.update
        targetType:
          type: string
          example: admin
        targetId:
          type: string
        detail:
          type: string
          description: JSON 变更摘要；敏感值脱敏为 "******"
        ip:
          type: string
        result:
          type: string
          enum: [success, fail]
        createdAt:
          type: string
          format: date-time

# ───────────────────────── 公共数据结构 ─────────────────────────
# 说明：本文件其余部分沿用「就地内联 schema」的写法，只有安装向导的请求体
# 被两条路径共用（/api/setup/test 与 /api/setup/install），故单独抽取。
components:
  schemas:
    SetupInstallReq:
      type: object
      description: 安装/测试连接的扁平表单，与后端 `setup.InstallReq` 字段一一对应
      properties:
        engine:
          type: string
          enum: [mysql, sqlite]
          description: 缺省按 mysql 处理
        dbHost:
          type: string
          example: mysql
        dbPort:
          type: string
          example: "3306"
        dbUser:
          type: string
          example: root
        dbPassword:
          type: string
          description: 仅上行，响应与日志不回显
        dbName:
          type: string
          example: weichuan
          description: 仅字母数字下划线（服务端白名单校验，防注入）
        createDatabase:
          type: boolean
          description: 仅 MySQL：库不存在时 CREATE DATABASE IF NOT EXISTS
        sqlitePath:
          type: string
          example: ./data/weichuan.db
        adminUser:
          type: string
          example: admin
        adminPass:
          type: string
          description: ≥8 位，且不能是内置缺省口令
        adminPass2:
          type: string
          description: 必须与 adminPass 一致（装完登不进去的第一大原因）
        jwtKey:
          type: string
          description: 留空由服务端 crypto/rand 生成；不能是内置缺省密钥
        cookieSecure:
          type: boolean
          description: true 时写入 COOKIE_SECURE=true（站点已启用 https）
