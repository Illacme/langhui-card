components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "小程序端 access 令牌（Authorization: Bearer <token>）"
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: PC 管理后台 httpOnly Cookie（浏览器自动携带）

  schemas:
    Code:
      type: integer
      description: 0=成功；1=业务失败；2=特殊状态；401=未登录/失效；403=无权限；429=限流
      enum: [0, 1, 2, 401, 403, 429]

    Employee:
      type: object
      properties:
        staffId:
          type: integer
          format: int64
        name:
          type: string
        title:
          type: string
        avatar:
          type: string
        phone:
          type: string
        landline:
          type: string
          description: 座机
        email:
          type: string
        status:
          type: string
          enum: [enabled, disabled]
        createdAt:
          type: string
          format: date-time

    CompanyInfo:
      type: object
      properties:
        fullName:
          type: string
        address:
          type: string
        tel:
          type: string
        logo:
          type: string

    CompanyInfoInput:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
        address:
          type: string
        tel:
          type: string
        logo:
          type: string

    CompanyProfile:
      type: object
      properties:
        introText:
          type: string
          description: 富文本
        videoChannelId:
          type: string
        backupMp4URL:
          type: string
        cover:
          type: string

    CompanyProfileInput:
      type: object
      properties:
        introText:
          type: string
        videoChannelId:
          type: string
        backupMp4URL:
          type: string
        cover:
          type: string

    AchievementCategory:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        icon:
          type: string
        sort:
          type: integer
        isLocked:
          type: boolean

    ProjectCase:
      type: object
      properties:
        id:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        name:
          type: string
        summary:
          type: string
        detail:
          type: string
        cover:
          type: string
        album:
          description: JSON 数组字符串（列表接口）；详情接口解析为字符串数组
          type: string
        isHomeFeatured:
          type: boolean
        enabled:
          type: boolean
        sort:
          type: integer
        createdAt:
          type: string
          format: date-time

    ProjectInput:
      type: object
      required: [categoryId, name]
      properties:
        categoryId:
          type: integer
          format: int64
        name:
          type: string
        summary:
          type: string
        detail:
          type: string
        cover:
          type: string
        album:
          type: array
          items:
            type: string
        isHomeFeatured:
          type: boolean
        enabled:
          type: boolean
        sort:
          type: integer

    ProjectDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        summary:
          type: string
        detail:
          type: string
        cover:
          type: string
        album:
          type: array
          items:
            type: string
        categoryId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    BizService:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
          description: 富文本，视频号块为 <wx-video channel-id="gh_xxx"></wx-video>
        sort:
          type: integer
        createdAt:
          type: string
          format: date-time

    OpenApply:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        title:
          type: string
        avatar:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectReason:
          type: string
        createdAt:
          type: string
          format: date-time

    CardModifyApply:
      type: object
      properties:
        id:
          type: integer
          format: int64
        staffId:
          type: integer
          format: int64
        snapshot:
          type: string
          description: JSON：变更字段 {avatar,name,title,phone,email}
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectReason:
          type: string
        createdAt:
          type: string
          format: date-time
