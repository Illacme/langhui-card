  /api/admin/employees:
    get:
      tags: [超管-员工管理]
      summary: 员工列表（服务端分页）
      description: |
        按租户隔离（企业管理员只看本企业；平台超管可用 ?companyId= 收窄）。
        staffIds 为按 id 精确取（上限 200 条），用于名片修改审核页回显员工原值。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: keyword
          in: query
          required: false
          description: 模糊匹配姓名 / 手机 / 手机2 / 职位 / 座机 / 昵称 / openid
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [enabled, disabled]
        - name: staffIds
          in: query
          required: false
          description: 逗号分隔的 staff_id，如 1,2,3
          schema:
            type: string
        - name: companyId
          in: query
          required: false
          description: 仅平台超管可用
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Employee"
                  total:
                    $ref: "#/components/schemas/PageTotal"
                  page:
                    $ref: "#/components/schemas/PageIndex"
                  size:
                    $ref: "#/components/schemas/PageSize"
    post:
      tags: [超管-员工管理]
      summary: 新增员工（返回初始密码，仅展示一次）
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name:
                  type: string
                phone:
                  type: string
                phone2:
                  type: string
                  description: 第二个手机号（选填）；名片上与主号并列展示，不参与登录
                title:
                  type: string
                email:
                  type: string
                avatar:
                  type: string
                landline:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=1 手机号已存在 / 参数错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  staffId:
                    type: integer
                    format: int64
                  initialPassword:
                    type: string

