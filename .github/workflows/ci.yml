name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# 并发控制：同一 ref 只保留最新的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────── 后端：Go 构建 / 静态检查 / 测试（SQLite，零外部依赖） ─────────
  # 说明：默认只跑 SQLite。MySQL 相关用例（TestMySQLMigrations / TestAPIFlowMySQL）
  # 在未设置 TEST_MYSQL_DSN 时会自动 Skip，因此本 job 不需要任何数据库账号。
  backend:
    name: 后端 (Go / SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 构建
        working-directory: backend
        run: go build ./...

      - name: 静态检查
        working-directory: backend
        run: go vet ./...

      - name: 测试（SQLite 全流程 + 存储增强）
        working-directory: backend
        run: go test ./... -v

  # ───────── 后端：MySQL 生产契约 parity（可选，需配置 TEST_MYSQL_DSN） ─────────
  # 启用方式：在仓库 Settings → Secrets and variables → Actions → Variables
  # 新增变量 TEST_MYSQL_DSN（如 root:pwd@tcp(host:3306)/langhui_test?charset=utf8mb4&parseTime=true）。
  # 未配置时该 job 直接跳过，不影响 CI 绿灯。
  backend-mysql:
    name: 后端 (Go / MySQL parity)
    runs-on: ubuntu-latest
    if: ${{ vars.TEST_MYSQL_DSN != '' }}
    env:
      TEST_MYSQL_DSN: ${{ vars.TEST_MYSQL_DSN }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # 先验证「连得上 + migrations 能建表」，再跑完整 parity，
      # 便于区分：连接/建表失败 vs 业务断言在 MySQL 下不等价。
      - name: 测试（MySQL 连接与建表）
        working-directory: backend
        run: go test ./... -run TestMySQLMigrations -v

      - name: 测试（MySQL parity）
        working-directory: backend
        run: go test ./... -run TestAPIFlowMySQL -v

  # ───────── 前端：Vue 生产构建 + 单元测试 ─────────
  frontend:
    name: 前端 (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 生产构建
        run: npm run build

      - name: 单元测试
        run: npm run test

  # ───────── 前端：严格类型检查（非阻塞，仅暴露问题） ─────────
  # 说明：vue-tsc 在 moduleResolution: bundler 下，因 @wangeditor/* 的类型声明
  # （editor-for-vue 的 exports 未暴露 types、自定义节点模块 registerNodeType 的
  # 类型签名）会报若干错误；生产构建走 vite/esbuild 转译不受影响。
  # 设为 continue-on-error，使其作为「预警」而非「门禁」，逐步收敛。
  frontend-typecheck:
    name: 前端类型检查 (vue-tsc, 非阻塞)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（vue-tsc --noEmit）
        run: npm run type-check
